[project]
name = "troparevsky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.19",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "optimade[http-client]>=1.2.4",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[project.scripts]
troparevsky = "troparevsky.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["troparevsky"]
